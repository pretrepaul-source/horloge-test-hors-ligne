<!DOCTYPE html>
<html lang="fr" manifest="horloge.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Test horloge hors connexion</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050608;color:#e5e9ef;font-family:Arial,Helvetica,sans-serif;text-align:center}
#screen{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
#time{font-size:19vw;font-weight:bold;line-height:1.1}
#status{margin-top:25px;font-size:18px;color:transparent;padding:0 12px}
#hint{margin-top:14px;font-size:14px;color:#a3a3a3;padding:0 18px}
</style>
</head>
<body>
<div id="screen"><div id="time">--:--</div><div id="status">Initialisation...</div><div id="hint">Test hors connexion pour ancien iPad</div></div>
<script>
(function(){
  var time = document.getElementById('time');
  var status = document.getElementById('status');
  function tick(){var d=new Date();var h=d.getHours(),m=d.getMinutes();time.innerHTML=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
  tick();setInterval(tick,1000);
  if(window.applicationCache){
    var cache=window.applicationCache;
    function state(){
      var s=cache.status;
      if(s===0){status.innerHTML='Cache non disponible';}
      else if(s===1){status.innerHTML='Cache hors connexion pret';}
      else if(s===2||s===3){status.innerHTML='Enregistrement en cours...';}
      else if(s===4){status.innerHTML='Mise a jour prete';}
      else if(s===5){status.innerHTML='Cache ancien utilise';}
    }
    cache.addEventListener('cached',function(){status.innerHTML='Cache hors connexion pret';},false);
    cache.addEventListener('noupdate',state,false);
    cache.addEventListener('updateready',state,false);
    cache.addEventListener('downloading',state,false);
    cache.addEventListener('error',function(){status.innerHTML='Erreur de mise en cache';},false);
    state();
  }else{status.innerHTML='Cache non pris en charge';}
})();
</script>
</body>
</html>
